name: Pulse
options:
  bundleIdPrefix: dev.doblefilo
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pulse:
    type: application
    platform: macOS
    sources: [Pulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doblefilo.pulse
        PRODUCT_NAME: Pulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Pulse/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_NSCameraUsageDescription: Websites you allow can use your camera, for example for video calls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites you allow can use your microphone, for example for video calls.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
      # Debug builds are a separate app so they never touch the installed browser:
      # its data (session, history, cookies) is keyed by bundle ID,
      # and the distinct process name keeps `make run` from quitting the real Pulse.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.doblefilo.pulse.dev
          PRODUCT_NAME: Pulse Dev
          PRODUCT_MODULE_NAME: Pulse
          INFOPLIST_KEY_CFBundleDisplayName: Pulse Dev
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PulseTests]
    dependencies:
      - target: Pulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse.app/Contents/MacOS/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse Dev.app/Contents/MacOS/Pulse Dev"
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    test:
      targets: [PulseTests]
