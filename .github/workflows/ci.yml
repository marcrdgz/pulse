name: CI

on:
  push:
    branches: [main, webkit]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Pulse.xcodeproj -scheme Pulse -destination 'platform=macOS' -derivedDataPath build/DerivedData test -quiet
